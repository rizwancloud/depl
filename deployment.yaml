apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp2
  template:
    metadata:
      labels:
        app: myapp2
    spec:
      containers:
        - name: myapp2
          image: admindockerrizwan/myapp2
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
